<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Helena Møhncke — Filmregissør</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --black:   #060608;
  --off-black: #111;
  --dark:    #1a1a1a;
  --gold:    #c9a84c;
  --gold-light: #e8c97a;
  --crimson: #b82035;
  --white:   #ffffff;
  --muted:   rgba(255,255,255,0.55);
  --faint:   rgba(255,255,255,0.08);
}
html { scroll-behavior: smooth; }
body {
  font-family: 'Space Grotesk', sans-serif;
  background: var(--black);
  color: var(--white);
  overflow-x: hidden;
}
/* ── GRAIN + SCANLINES ─────────────────────────────── */
.grain {
  position: fixed;
  inset: 0;
  z-index: 999;
  pointer-events: none;
  opacity: 0.04;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  animation: grain-shift 0.5s steps(1) infinite;
}
.grain::after {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent 0px,
    transparent 2px,
    rgba(0,0,0,0.025) 2px,
    rgba(0,0,0,0.025) 4px
  );
}
@keyframes grain-shift {
  0%   { transform: translate(0,    0);    }
  10%  { transform: translate(-2%,  -3%);  }
  20%  { transform: translate(3%,   2%);   }
  30%  { transform: translate(-1%,  4%);   }
  40%  { transform: translate(2%,  -1%);   }
  50%  { transform: translate(-3%,  1%);   }
  60%  { transform: translate(1%,  -4%);   }
  70%  { transform: translate(-2%,  3%);   }
  80%  { transform: translate(4%,  -2%);   }
  90%  { transform: translate(-1%,  2%);   }
  100% { transform: translate(0,    0);    }
}
/* ── SCROLL-REVEAL ─────────────────────────────────── */
.reveal {
  clip-path: inset(0 0 100% 0);
  transition: clip-path 0.8s cubic-bezier(0.76, 0, 0.24, 1);
  will-change: clip-path;
}
.reveal.visible {
  clip-path: inset(0 0 0% 0);
}
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<!-- NAV -->
<!-- MOBILE MENU -->
<!-- HERO -->
<!-- CHAPTER 01: FILMER -->
<!-- TIDSLINJE INTERLUDE -->
<!-- CHAPTER 02: PRODUKSJON -->
<!-- CHAPTER 03: OM HELENA -->
<!-- PORTRETT-STRIP INTERLUDE -->
<!-- GALLERI INTERLUDE -->
<!-- CHAPTER 04: CV -->
<!-- KONTAKT -->
<!-- FOOTER -->
<script>
// Scroll-reveal
const revealThreshold = window.innerWidth <= 768 ? 0.05 : 0.12;
const revealObserver = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      e.target.classList.add('visible');
      revealObserver.unobserve(e.target);
    }
  });
}, { threshold: revealThreshold });
document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));
</script>
</body>
</html>
